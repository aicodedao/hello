services:
  # 1. Service Ứng Dụng Chính
  hello:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hello-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
    networks:
      - hello-network

  # 2. Service Cloudflare Tunnel Container
  hello-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: hello-tunnel
    restart: unless-stopped
    depends_on:
      - hello
    volumes:
      - /Users/scott_ng/.cloudflared/cert.pem:/etc/cloudflared/cert.pem:ro
    command: tunnel --no-autoupdate run --url http://hello:8080 hello-tunnel
    networks:
      - hello-network

networks:
  hello-network:
    driver: bridge
